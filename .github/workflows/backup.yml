name: Supabase backup

on:
  schedule:
    # Weekly on Sunday at 02:00 UTC. Supabase Free has no automated backups.
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  dump:
    name: Dump database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump public schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup-public.sql --schema public
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup-auth.sql --data-only --schema auth

      - name: Upload backup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: |
            backup-public.sql
            backup-auth.sql
          retention-days: 90
