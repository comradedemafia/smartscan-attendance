name: Supabase keep-alive

on:
  schedule:
    # Every 3 days at 03:00 UTC. Supabase Free pauses projects after ~7 days
    # without activity; this keeps the project active.
    - cron: "0 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Query a lightweight table
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/departments?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
          echo "Supabase project is active."
